<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Repertorios</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        margin: 0;
        padding: 20px;
        color: #1f2936;
      }
      h1,
      h2 {
        color: #246493;
      }
      form,
      .box {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 24px;
      }
      label {
        font-weight: 700;
        margin: 12px 0 6px;
        display: block;
      }
      input,
      textarea,
      select,
      button {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        border: 1px solid #d7e0ea;
        border-radius: 6px;
      }
      textarea {
        min-height: 92px;
        resize: vertical;
      }
      button {
        background: #246493;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      button:hover {
        background: #3399ff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .danger {
        background: #c0392b;
      }
      .danger:hover {
        background: #e74c3c;
      }
      .muted {
        color: #6b7280;
      }
      [data-field] {
        display: none;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Painel de Repertorios</h1>
    <p class="muted">
      Cadastre repertorios que aparecem dinamicamente na tela do app.
    </p>

    <form id="form-repertorio" enctype="multipart/form-data">
      <input type="hidden" id="repertorioId" name="id" />
      <label for="category">Categoria *</label>
      <select id="category" name="category" required>
        <option value="cinema">Cinema</option>
        <option value="livros">Livros</option>
        <option value="conhecimentos-gerais">Conhecimentos Gerais</option>
        <option value="dados-pesquisas">Dados e Pesquisas</option>
        <option value="citacoes">Citacoes</option>
      </select>

      <label for="title">Titulo / nome / citacao *</label>
      <input type="text" id="title" name="title" required />

      <div class="grid">
        <div data-field="cinema">
          <label for="type">Tipo</label>
          <select id="type" name="type">
            <option value="">Selecione</option>
            <option value="Filme">Filme</option>
            <option value="Documentario">Documentario</option>
            <option value="Serie">Serie</option>
          </select>
        </div>
        <div data-field="cinema livros">
          <label for="genre">Genero</label>
          <input type="text" id="genre" name="genre" />
        </div>
        <div data-field="cinema">
          <label for="duration">Duracao</label>
          <input type="text" id="duration" name="duration" />
        </div>
        <div data-field="cinema">
          <label for="rating">Classificacao indicativa</label>
          <input type="text" id="rating" name="rating" />
        </div>
        <div data-field="cinema">
          <label for="country">Pais</label>
          <input type="text" id="country" name="country" />
        </div>
        <div data-field="livros">
          <label for="pages">Paginas</label>
          <input type="text" id="pages" name="pages" />
        </div>
        <div data-field="cinema livros">
          <label for="year">Ano</label>
          <input
            type="number"
            id="year"
            name="year"
            min="1800"
            max="2100"
            placeholder="Ex: 2024"
          />
        </div>
        <div data-field="citacoes livros">
          <label for="author">Autor</label>
          <input type="text" id="author" name="author" />
        </div>
        <div data-field="conhecimentos-gerais">
          <label for="knowledgeArea">Area do conhecimento</label>
          <input type="text" id="knowledgeArea" name="knowledgeArea" />
        </div>
      </div>

      <div class="grid">
        <div data-field="cinema livros conhecimentos-gerais dados-pesquisas">
          <label for="coverUrl">Capa por URL</label>
          <input type="url" id="coverUrl" name="coverUrl" />
        </div>
        <div data-field="cinema livros conhecimentos-gerais dados-pesquisas">
          <label for="capa">Capa por arquivo</label>
          <input type="file" id="capa" name="capa" accept="image/*" />
        </div>
      </div>

      <div data-field="cinema livros">
        <label for="synopsis">Sinopse</label>
        <textarea id="synopsis" name="synopsis"></textarea>
      </div>

      <div data-field="conhecimentos-gerais dados-pesquisas">
        <label for="info">Informacoes</label>
        <textarea id="info" name="info"></textarea>
      </div>

      <div data-field="dados-pesquisas">
        <label for="highlightedData">Principais dados marcados</label>
        <textarea
          id="highlightedData"
          name="highlightedData"
          placeholder="Um dado por linha ou separado por virgula"
        ></textarea>
      </div>

      <label for="thematicAxes">Eixos tematicos</label>
      <textarea
        id="thematicAxes"
        name="thematicAxes"
        placeholder="Um eixo por linha ou separado por virgula"
      ></textarea>

      <div data-field="cinema">
        <label for="streamingLinks">Streamings disponiveis / links</label>
        <textarea id="streamingLinks" name="streamingLinks"></textarea>
      </div>

      <div data-field="cinema">
        <label for="trailerUrl">Trailer</label>
        <input type="url" id="trailerUrl" name="trailerUrl" />
      </div>

      <div data-field="livros conhecimentos-gerais dados-pesquisas">
        <label for="sourceLinks">Fontes / links uteis</label>
        <textarea id="sourceLinks" name="sourceLinks"></textarea>
      </div>

      <label for="essayUse">Como poderia ser usado na redacao *</label>
      <textarea id="essayUse" name="essayUse" required></textarea>

      <div style="display: flex; gap: 8px; align-items: center">
        <button type="submit" id="btn-salvar">Salvar repertorio</button>
        <button
          type="button"
          id="btn-novo"
          style="background: #f3f4f6; color: #1f2936; border: 1px solid #e5e7eb"
        >
          Novo
        </button>
      </div>
    </form>

    <h2>Gerenciar Repertorios</h2>
    <div class="box">
      <input
        type="text"
        id="busca-repertorio"
        placeholder="Pesquisar por titulo"
      />
      <select id="select-repertorio">
        <option value="">Selecione um repertorio...</option>
      </select>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <button id="btn-editar" type="button" style="background: #2196f3">
          Editar selecionado
        </button>
        <button class="danger" id="btn-excluir" type="button">
          Excluir selecionado
        </button>
      </div>
      <div
        id="status-msg"
        style="
          margin-top: 10px;
          color: #246493;
          font-weight: 700;
          min-height: 20px;
        "
      ></div>
    </div>

    <script>
      const category = document.getElementById("category");
      const form = document.getElementById("form-repertorio");
      const busca = document.getElementById("busca-repertorio");
      const select = document.getElementById("select-repertorio");
      const statusMsg = document.getElementById("status-msg");
      let repertorios = [];

      function atualizarCampos() {
        document.querySelectorAll("[data-field]").forEach((field) => {
          field.style.display = field.dataset.field
            .split(" ")
            .includes(category.value)
            ? "block"
            : "none";
        });
      }

      function atualizarSelect(filtro = "") {
        const termo = filtro.toLowerCase();
        const filtrados = repertorios.filter((item) =>
          item.title.toLowerCase().includes(termo),
        );
        select.innerHTML =
          '<option value="">Selecione um repertorio...</option>';
        if (!filtrados.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "Nenhum repertorio encontrado";
          option.disabled = true;
          select.appendChild(option);
          return;
        }
        filtrados.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = `${item.title} (${item.category}${item.year ? " - " + item.year : ""})`;
          select.appendChild(option);
        });
      }

      async function carregarRepertorios() {
        try {
          statusMsg.textContent = "Carregando repertorios...";
          const response = await fetch("/repertorios");
          if (!response.ok) throw new Error(`Erro ${response.status}`);
          repertorios = await response.json();
          console.log("Repertorios carregados:", repertorios);
          statusMsg.textContent = `✓ ${repertorios.length} repertorios carregados`;
          atualizarSelect(busca.value);
        } catch (err) {
          console.error("Erro ao carregar repertorios:", err);
          statusMsg.textContent = "✗ Erro ao carregar repertorios";
          statusMsg.style.color = "#c0392b";
          repertorios = [];
        }
      }

      category.addEventListener("change", atualizarCampos);
      busca.addEventListener("input", () => atualizarSelect(busca.value));

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const id = document.getElementById("repertorioId").value;
        let response;
        if (id) {
          response = await fetch(`/repertorios/${encodeURIComponent(id)}`, {
            method: "PUT",
            body: formData,
          });
        } else {
          response = await fetch("/repertorios", {
            method: "POST",
            body: formData,
          });
        }
        if (response.ok) {
          alert(
            id
              ? "Repertorio atualizado com sucesso!"
              : "Repertorio salvo com sucesso!",
          );
          form.reset();
          document.getElementById("repertorioId").value = "";
          document.getElementById("btn-salvar").textContent =
            "Salvar repertorio";
          atualizarCampos();
          carregarRepertorios();
        } else {
          const data = await response.json().catch(() => ({}));
          alert(data.error || "Erro ao salvar repertorio.");
        }
      });

      document
        .getElementById("btn-excluir")
        .addEventListener("click", async () => {
          const id = select.value;
          if (!id) return alert("Selecione um repertorio");
          const item = repertorios.find(
            (repertorio) => String(repertorio.id) === String(id),
          );
          if (
            !confirm(
              `Excluir "${item?.title || "repertorio"}"? Esta ação não pode ser desfeita.`,
            )
          )
            return;
          try {
            const response = await fetch(
              `/repertorios/${encodeURIComponent(id)}`,
              {
                method: "DELETE",
              },
            );
            if (response.ok) {
              alert("Repertorio excluido com sucesso");
              select.value = "";
              form.reset();
              statusMsg.textContent = "✓ Repertorio excluido";
              atualizarCampos();
              carregarRepertorios();
            } else {
              const err = await response.json().catch(() => ({}));
              alert(err.error || "Erro ao excluir repertorio");
            }
          } catch (err) {
            console.error("Erro:", err);
            alert("Erro ao excluir repertorio: " + err.message);
          }
        });

      atualizarCampos();
      carregarRepertorios();

      // Função para preencher formulário
      function preencherFormulario(item) {
        if (!item) return;
        console.log("Preenchendo formulario com:", item);
        document.getElementById("repertorioId").value = item.id || "";
        document.getElementById("category").value = item.category || "";
        atualizarCampos();
        document.getElementById("title").value = item.title || "";
        document.getElementById("type").value = item.type || "";
        document.getElementById("genre").value = item.genre || "";
        document.getElementById("duration").value = item.duration || "";
        document.getElementById("rating").value = item.rating || "";
        document.getElementById("country").value = item.country || "";
        document.getElementById("pages").value = item.pages || "";
        document.getElementById("year").value = item.year || "";
        document.getElementById("author").value = item.author || "";
        document.getElementById("knowledgeArea").value =
          item.knowledgeArea || "";
        document.getElementById("coverUrl").value = item.coverUrl || "";
        document.getElementById("synopsis").value = item.synopsis || "";
        document.getElementById("info").value = item.info || "";
        document.getElementById("highlightedData").value =
          item.highlightedData || "";
        document.getElementById("thematicAxes").value = item.thematicAxes || "";
        document.getElementById("streamingLinks").value =
          item.streamingLinks || "";
        document.getElementById("trailerUrl").value = item.trailerUrl || "";
        document.getElementById("sourceLinks").value = item.sourceLinks || "";
        document.getElementById("essayUse").value = item.essayUse || "";
        document.getElementById("btn-salvar").textContent = "Salvar alterações";
        statusMsg.textContent = `✓ Editar: ${item.title}`;
        statusMsg.style.color = "#246493";
      }

      // Botão editar
      document.getElementById("btn-editar").addEventListener("click", () => {
        const id = select.value;
        if (!id) return alert("Selecione um repertorio primeiro");
        const item = repertorios.find((r) => String(r.id) === String(id));
        if (!item) return alert("Repertorio não encontrado");
        preencherFormulario(item);
        form.scrollIntoView({ behavior: "smooth" });
      });

      // botao novo/limpar
      document.getElementById("btn-novo").addEventListener("click", () => {
        form.reset();
        document.getElementById("repertorioId").value = "";
        document.getElementById("btn-salvar").textContent = "Salvar repertorio";
        select.value = "";
        statusMsg.textContent = "";
        atualizarCampos();
      });
    </script>
  </body>
</html>
